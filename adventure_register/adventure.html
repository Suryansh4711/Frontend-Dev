<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Camp Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('./green-trees-near-body-water-daytime_395237-20.avif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.55);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
        }

        .card {
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border: none;
        }

        .card h3 {
            font-weight: 600;
            color: #2c3e50;
        }

        label {
            font-weight: 500;
            color: #2c3e50;
        }

        .btn-primary {
            background-color: #1abc9c;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #16a085;
            transform: scale(1.03);
        }

        .container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="overlay"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <h3 class="text-center mb-4">Adventure Camp Registration</h3>

                        <form>
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="Age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="Age" placeholder="Enter your age"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="male"
                                        required>
                                    <label class="form-check-label" for="male">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="female"
                                        value="female" required>
                                    <label class="form-check-label" for="female">Female</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label">Contact Number</label>
                                <input type="number" class="form-control" id="phoneNumber"
                                    placeholder="Enter your phone number" required>
                            </div>

                            <div class="mb-3">
                                <label for="adventureType" class="form-label">Camp Type</label>
                                <select class="form-select" id="adventureType" required>
                                    <option value="" selected disabled>Select Camp Type</option>
                                    <option value="hiking">Hiking</option>
                                    <option value="rafting">Rafting</option>
                                    <option value="climbing">Climbing</option>
                                    <option value="safari">Safari</option>
                                    <option value="cycling">Cycling</option>
                                </select>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Register</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
