<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>Dashboard</h1>
        </header>
        
        <aside class="sidebar">
            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#analytics">Analytics</a>
                <a href="#reports">Reports</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="box box-wide">
                <h3>Statistics Overview</h3>
                <p>This box spans two columns</p>
            </div>
            <div class="box">
                <h3>Sales</h3>
                <p>$45,230</p>
            </div>
            <div class="box">
                <h3>Users</h3>
                <p>2,345</p>
            </div>
            <div class="box">
                <h3>Revenue</h3>
                <p>$89,500</p>
            </div>
        </main>
    </div>
</body>
</html>
