<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <figure class="gallery-item">
            <div class="image-placeholder">Image 1</div>
            <figcaption>Mountain Landscape</figcaption>
        </figure>
        
        <figure class="gallery-item">
            <div class="image-placeholder">Image 2</div>
            <figcaption>City Skyline</figcaption>
        </figure>
        
        <figure class="gallery-item">
            <div class="image-placeholder">Image 3</div>
            <figcaption>Ocean View</figcaption>
        </figure>
        
        <figure class="gallery-item">
            <div class="image-placeholder">Image 4</div>
            <figcaption>Forest Path</figcaption>
        </figure>
        
        <figure class="gallery-item">
            <div class="image-placeholder">Image 5</div>
            <figcaption>Desert Sunset</figcaption>
        </figure>
        
        <figure class="gallery-item">
            <div class="image-placeholder">Image 6</div>
            <figcaption>Northern Lights</figcaption>
        </figure>
    </div>

</html>
