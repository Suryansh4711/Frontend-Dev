<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <h2>Product Title</h2>
                <div class="card-image">Product Image</div>
            </div>
            <div class="card-back">
                <h2>Description</h2>
                <p>This is a detailed description of the product. It includes all the important information that customers need to know about the features and benefits.</p>
            </div>
        </div>
    </div>
</body>
</html>
