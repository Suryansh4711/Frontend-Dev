<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="q3-image-showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase Gallery</h1>
    </header>
    
    <main>
        <section class="gallery">
            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=1" alt="Nature landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Landscape</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=2" alt="Urban architecture">
                    <div class="overlay"></div>
                </div>
                <figcaption>Urban Architecture</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=3" alt="Ocean view">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean Serenity</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=4" alt="Mountain peaks">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Peaks</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=5" alt="Forest path">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Adventure</figcaption>
            </figure>

            <figure class="gallery-item">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=6" alt="Desert sunset">
                    <div class="overlay"></div>
                </div>
                <figcaption>Desert Sunset</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Image Showcase</p>
    </footer>
</body>
</html>
