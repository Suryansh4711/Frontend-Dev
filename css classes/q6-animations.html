<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="q6-animations.css">
</head>
<body>
    <header>
        <h1 class="animated-title">CSS Animation Demonstration</h1>
        <p>Watch these smooth CSS animations</p>
    </header>
    
    <main>
        <section class="animation-container">
            <div class="animation-box">
                <h3>Moving Box</h3>
                <div class="box moving-box"></div>
            </div>

            <div class="animation-box">
                <h3>Bouncing Ball</h3>
                <div class="ball bouncing-ball"></div>
            </div>

            <div class="animation-box">
                <h3>Color Changing Text</h3>
                <p class="color-text">Rainbow Effect</p>
            </div>

            <div class="animation-box">
                <h3>Rotating Square</h3>
                <div class="box rotating-box"></div>
            </div>

            <div class="animation-box">
                <h3>Pulsing Circle</h3>
                <div class="circle pulsing-circle"></div>
            </div>

            <div class="animation-box">
                <h3>Sliding Bar</h3>
                <div class="bar sliding-bar"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CSS Animations</p>
    </footer>
</body>
</html>
