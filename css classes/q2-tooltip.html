<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2-tooltip.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the items below to see tooltips</p>
    </header>
    
    <main>
        <section class="tooltip-container">
            <div class="tooltip-item">
                <span class="icon">🏠</span>
                <span class="tooltip">Home</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">⚙️</span>
                <span class="tooltip">Settings</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">📧</span>
                <span class="tooltip">Messages</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">👤</span>
                <span class="tooltip">Profile</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">🔔</span>
                <span class="tooltip">Notifications</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">❤️</span>
                <span class="tooltip">Favorites</span>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Tooltip Demo</p>
    </footer>
</body>
</html>
