<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="q7-ui-components.css">
</head>
<body>
    <header>
        <h1>User Interface Components</h1>
        <p>Modern UI elements with smooth interactions</p>
    </header>
    
    <main>
        <div class="ui-card">
            <h2>Search and Actions</h2>
            
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Search anything...">
                <button class="search-btn">🔍</button>
            </div>

            <div class="button-container">
                <button class="ui-btn primary-btn">Primary Action</button>
                <button class="ui-btn secondary-btn">Secondary</button>
                <button class="ui-btn danger-btn">Delete</button>
            </div>

            <div class="dropdown-container">
                <select class="dropdown">
                    <option value="">Select an option</option>
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="text-input" placeholder="your@email.com">
            </div>

            <div class="input-group">
                <label for="message">Message</label>
                <textarea id="message" class="text-input textarea" rows="4" placeholder="Type your message..."></textarea>
            </div>

            <div class="checkbox-container">
                <label class="checkbox-label">
                    <input type="checkbox" class="checkbox">
                    <span>I agree to the terms and conditions</span>
                </label>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 UI Components</p>
    </footer>
</body>
</html>
