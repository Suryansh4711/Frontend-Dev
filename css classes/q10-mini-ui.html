<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Mini User Interface</title>
    <link rel="stylesheet" href="q10-mini-ui.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo">🎯 MyApp</div>
            <nav class="nav-menu">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Features</a>
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>
            <button class="header-btn">Sign Up</button>
        </div>
    </header>

    <main class="main-content">
        <div class="content-card">
            <div class="card-header">
                <h1>Welcome Back!</h1>
                <p>Please fill in your details to continue</p>
            </div>

            <div class="card-image">
                <img src="https://picsum.photos/400/200?random=1" alt="Welcome image">
            </div>

            <form class="user-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country">
                        <option value="">Select your country</option>
                        <option value="us">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="ca">Canada</option>
                        <option value="au">Australia</option>
                        <option value="in">India</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" required>
                        <span>I agree to the Terms and Conditions</span>
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>About Us</h3>
                <p>We create amazing user experiences</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
            <div class="footer-section">
                <h3>Contact</h3>
                <p>info@myapp.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 MyApp. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
