<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="q5-buttons.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Explore different button styles and states</p>
    </header>
    
    <main>
        <section class="button-section">
            <h2>Primary Buttons</h2>
            <div class="button-group">
                <button class="btn btn-primary">Primary Button</button>
                <button class="btn btn-primary" disabled>Disabled Primary</button>
            </div>
        </section>

        <section class="button-section">
            <h2>Secondary Buttons</h2>
            <div class="button-group">
                <button class="btn btn-secondary">Secondary Button</button>
                <button class="btn btn-secondary" disabled>Disabled Secondary</button>
            </div>
        </section>

        <section class="button-section">
            <h2>Outline Buttons</h2>
            <div class="button-group">
                <button class="btn btn-outline">Outline Blue</button>
                <button class="btn btn-outline-success">Outline Green</button>
                <button class="btn btn-outline-danger">Outline Red</button>
                <button class="btn btn-outline" disabled>Disabled Outline</button>
            </div>
        </section>

        <section class="button-section">
            <h2>Special States</h2>
            <div class="button-group">
                <button class="btn btn-hover">Hover Effect</button>
                <button class="btn btn-focus">Focus Effect (Tab to focus)</button>
                <button class="btn btn-active">Active Effect (Click)</button>
            </div>
        </section>

        <section class="button-section">
            <h2>Size Variations</h2>
            <div class="button-group">
                <button class="btn btn-primary btn-small">Small</button>
                <button class="btn btn-primary btn-medium">Medium</button>
                <button class="btn btn-primary btn-large">Large</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Button Collection</p>
    </footer>
</body>
</html>
