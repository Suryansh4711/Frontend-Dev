<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q1 - Welcome Greeting</title>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    #welcome { padding: 12px; border: 1px solid #ccc; display:inline-block; cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Welcome Page Greeting</h1>
    </header>

    <section id="greetingSection">
      <div id="welcome">Welcome!</div>
      <p id="welcomeMsg">We're glad you're here.</p>
      <div style="margin-top:12px">
        <button id="changeGreeting">Change Greeting</button>
        <button id="toggleWelcome">Toggle Welcome Message</button>
      </div>
    </section>

    <footer>
      <small>Q1 Demo</small>
    </footer>
  </main>

  <script src="q1_welcome_greeting.js"></script>
</body>
</html>
