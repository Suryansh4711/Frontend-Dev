<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Outline and Focus Styling Demo</h1>
        <p>Click on form elements to see focus effects</p>
    </header>
    
    <main>
        <form class="demo-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" class="outline-solid">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" class="outline-dashed">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" class="outline-dotted">
            </div>
            
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" class="outline-double">
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" class="outline-offset"></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Submit Form</button>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2024 Form Styling Demo</p>
    </footer>
</body>
</html>
