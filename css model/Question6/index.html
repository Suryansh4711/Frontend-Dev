<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation effect</p>
    </header>
    
    <main>
        <div class="transform-container">
            <div class="transform-box rotate-box">
                <div class="content">Rotate</div>
                <p class="label">rotate(45deg)</p>
            </div>
            
            <div class="transform-box scale-box">
                <div class="content">Scale</div>
                <p class="label">scale(1.3)</p>
            </div>
            
            <div class="transform-box translate-box">
                <div class="content">Translate</div>
                <p class="label">translate(20px, -20px)</p>
            </div>
            
            <div class="transform-box skew-box">
                <div class="content">Skew</div>
                <p class="label">skew(20deg, 5deg)</p>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 CSS Transformations Demo</p>
    </footer>
</body>
</html>
