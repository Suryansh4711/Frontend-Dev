<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over images to see the original without filters</p>
    </header>

    <main>
        <section class="gallery">
            <!-- Image 1: Blur Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400" 
                     alt="Mountain landscape" 
                     class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Image 2: Grayscale Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511593358241-7eea1f3c84e5?w=400" 
                     alt="Desert sunset" 
                     class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Image 3: Sepia Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400" 
                     alt="Forest path" 
                     class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Image 4: Brightness Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400" 
                     alt="Ocean waves" 
                     class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Image 5: Contrast Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400" 
                     alt="Rocky mountains" 
                     class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Image 6: Hue-Rotate Filter -->
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400" 
                     alt="Green forest" 
                     class="filter-hue-rotate">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Responsive CSS Gallery</p>
    </footer>
</body>
</html>
