<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q1 - Live Product Search</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script defer src="q1_live_search.js"></script>
  <style>
    .result{ display:flex; gap:8px; align-items:center; padding:6px; border-bottom:1px solid #eee }

<body>
  <h2>Live Product Search</h2>

</html>
