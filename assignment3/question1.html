<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - YouTube Video Embed</title>
</head>
<body>
    <!-- Question 1: YouTube video with percentage dimensions -->
    <h1>YouTube Video Embed</h1>
    
    <!-- Embedding YouTube video with percentage-based width and height -->
    <!-- This makes the video responsive and adjusts when browser is resized -->
    <iframe 
        width="80%" 
        height="50%" 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="YouTube video player" 
        frameborder="0" 
        allowfullscreen>
    </iframe>
    
    <p>This video uses percentage values for width (80%) and height (50%) to make it responsive.</p>
</body>
</html>
