<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding specification -->
    <meta charset="UTF-8">
    
    <!-- Author information -->
    <meta name="author" content="Student Name">
    
    <!-- Viewport settings for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Question 5 - Complete Head Section</title>
</head>
<body>
    <!-- Question 5: Complete head section with multilingual text -->
    <h1>UTF-8 Encoding Demonstration</h1>
    
    <!-- English text -->
    <p><strong>English:</strong> Hello, welcome to our website!</p>
    
    <!-- Hindi text -->
    <p><strong>Hindi:</strong> नमस्ते, हमारी वेबसाइट पर आपका स्वागत है!</p>
    
    <!-- Japanese text -->
    <p><strong>Japanese:</strong> こんにちは、私たちのウェブサイトへようこそ！</p>
    
    <p>The UTF-8 encoding allows us to display characters from multiple languages correctly.</p>
</body>
</html>
